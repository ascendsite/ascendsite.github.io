<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascend SMP</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="top-bar">
        <h1 class="title">Ascend SMP</h1>
        <div class="nav-links">
            <a href="/teams" class="nav-btn">Teams</a>
            <a href="https://discord.gg/3hVn6jbUfm" class="discord-link" target="_blank" rel="noopener noreferrer">Discord</a>
        </div>
    </div>

    <div class="hero">
        <div class="particles"></div>
            <div class="ip-display" id="ip">ascendsmp.mcserv.fun</div>
    </div>

    <script>
        document.getElementById('ip').addEventListener('click', function() {
            navigator.clipboard.writeText('ascendsmp.mcserv.fun').then(() => {
                this.textContent = 'Copied!';
                setTimeout(() => {
                    this.textContent = 'ascendsmp.mcserv.fun';
                }, 1500);
            });
        });
    </script>
</body>
